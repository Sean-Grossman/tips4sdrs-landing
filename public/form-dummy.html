<!DOCTYPE html>
<html>
<head>
  <title>Netlify Forms</title>
</head>
<body>
  <!-- Subscription Form -->
  <form name="subscribe" method="POST" netlify netlify-honeypot="bot-field" data-netlify-recaptcha="true">
    <input type="hidden" name="form-name" value="subscribe" />
    <p class="hidden">
      <label>Don't fill this out if you're human: <input name="bot-field" /></label>
    </p>
    <p>
      <label>Email: <input type="email" name="email" /></label>
    </p>
    <div data-netlify-recaptcha="true"></div>
  </form>

  <!-- Tip Submission Form -->
  <form name="tip-submission" method="POST" netlify netlify-honeypot="bot-field" data-netlify-recaptcha="true">
    <input type="hidden" name="form-name" value="tip-submission" />
    <p class="hidden">
      <label>Don't fill this out if you're human: <input name="bot-field" /></label>
    </p>
    <p>
      <label>Name: <input type="text" name="name" /></label>
    </p>
    <p>
      <label>Email: <input type="email" name="email" /></label>
    </p>
    <p>
      <label>Recipient Name: <input type="text" name="recipientName" /></label>
    </p>
    <p>
      <label>Recipient Email: <input type="email" name="recipientEmail" /></label>
    </p>
    <p>
      <label>Message: <textarea name="message"></textarea></label>
    </p>
    <p>
      <label>Tip Amount: <input type="text" name="tipAmount" /></label>
    </p>
    <div data-netlify-recaptcha="true"></div>
  </form>
</body>
</html>
