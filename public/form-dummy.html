<!DOCTYPE html>
<html>
<head>
  <title>Form Definitions for Netlify</title>
</head>
<body>
  <!-- Subscription Form -->
  <form name="subscribe" method="POST" data-netlify="true">
    <input type="hidden" name="form-name" value="subscribe" />
    <input type="email" name="email" />
    <input type="text" name="bot-field" />
  </form>

  <!-- Tip Submission Form -->
  <form name="tip-submission" method="POST" data-netlify="true" data-netlify-recaptcha="true">
    <input type="hidden" name="form-name" value="tip-submission" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="recipientName" />
    <input type="email" name="recipientEmail" />
    <textarea name="message"></textarea>
    <input type="text" name="tipAmount" />
    <div data-netlify-recaptcha="true"></div>
  </form>
</body>
</html>
