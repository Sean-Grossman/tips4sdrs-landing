[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
  [plugins.inputs]
    # Enable experimental directory for forms support with Next.js App Router
    # See: https://ntl.fyi/next-runtime-forms-migration
    experimental_dir = "/public/forms"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 3002
  targetPort = 3002
  framework = "nextjs"
