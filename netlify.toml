[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_RUNTIME = "edge"
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# We don't need this redirect for Next.js apps
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  framework = "next"
